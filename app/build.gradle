plugins { id 'com.android.application' }

android {
    namespace 'com.echovault.game'
    compileSdk 35
    defaultConfig {
        applicationId 'com.echovault.game'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
        externalNativeBuild { cmake { cppFlags '-std=c++17 -O2' } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt' } }
}
